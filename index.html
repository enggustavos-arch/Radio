<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fonia VH-VHD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --deep:#03121C;
    --deep2:#061E2C;
    --scope:#1FE0A8;
    --scope-dim:rgba(31,224,168,.16);
    --ink:#FFFFFF;
    --mute:rgba(190,216,228,.62);
    --line:rgba(120,190,215,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--deep)}
  body{
    height:100%;margin:0;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, var(--deep2) 0%, var(--deep) 62%, #010A11 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- radar de fundo ---------- */
  #scope{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:0;opacity:.5;
  }
  #scope .ring{fill:none;stroke:var(--scope);stroke-opacity:.20;stroke-width:.9}
  #scope .ring.major{stroke-opacity:.32;stroke-width:1.3}
  #scope .spoke{stroke:var(--scope);stroke-opacity:.11;stroke-width:.8}
  #scope .tick{fill:var(--scope);fill-opacity:.32;font-size:9px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
  #sweep{transform-origin:50% 50%;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- barra superior ---------- */
  header{
    position:relative;z-index:2;flex:0 0 auto;
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(3,18,28,.85), rgba(3,18,28,.35));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .stn{
    font-size:15px;font-weight:700;letter-spacing:.22em;
    color:var(--scope);text-shadow:0 0 16px rgba(31,224,168,.45);
    white-space:nowrap;
  }
  .live{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--scope);box-shadow:0 0 12px var(--scope);
    margin-right:10px;vertical-align:middle;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .spacer{flex:1}
  .meta{font-size:12px;color:var(--mute);letter-spacing:.14em;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}

  /* ---------- faixa de rota ---------- */
  #route{
    position:relative;z-index:2;flex:0 0 auto;
    display:flex;align-items:center;gap:14px;
    padding:9px 20px 4px;
    border-bottom:1px solid var(--line);
  }
  .ap{
    font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.16em;
    color:var(--scope);white-space:nowrap;opacity:.9;
    text-shadow:0 0 14px rgba(31,224,168,.35);
  }
  .ap.off{color:var(--mute);opacity:.55;text-shadow:none}
  #track{position:relative;flex:1 1 auto;height:30px;min-width:60px}
  #track::before{
    content:"";position:absolute;left:0;right:0;top:8px;height:2px;
    background:var(--line);border-radius:2px;
  }
  #fill{
    position:absolute;left:0;top:8px;height:2px;width:0;
    background:var(--scope);opacity:.5;border-radius:2px;
    transition:width .45s ease;
  }
  .node{
    position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;
    border-radius:50%;background:var(--deep);
    border:1.5px solid rgba(120,190,215,.32);
    transition:transform .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .node.done{background:var(--scope);border-color:var(--scope);opacity:.45}
  .node.now{
    background:var(--scope);border-color:var(--scope);
    box-shadow:0 0 16px var(--scope);transform:scale(1.4);
  }
  .node b{
    position:absolute;top:15px;left:50%;transform:translateX(-50%);
    font:700 9px ui-monospace,Menlo,monospace;letter-spacing:.12em;
    color:var(--scope);white-space:nowrap;display:none;
  }
  .node.now b{display:block}

  /* ---------- palco ---------- */
  main{
    position:relative;z-index:2;flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
    padding:18px 22px;
  }
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--mute);margin-bottom:10px;flex:0 0 auto;
  }
  #say{
    flex:1 1 auto;min-height:0;display:flex;align-items:center;
    font-weight:700;line-height:1.13;letter-spacing:-.012em;
    color:var(--ink);
    text-shadow:0 2px 26px rgba(2,10,16,.95), 0 0 60px rgba(2,10,16,.9);
    overflow:hidden;
  }
  #say span{display:block;width:100%}
  #tip{
    flex:0 0 auto;margin-top:12px;
    font-size:15px;color:var(--mute);line-height:1.35;
    text-shadow:0 1px 14px rgba(2,10,16,.9);
  }
  .idle{color:var(--mute);font-weight:600}

  /* ---------- rodape / widget ---------- */
  footer{
    position:relative;z-index:2;flex:0 0 auto;
    min-height:150px;
    padding:10px 20px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    display:flex;align-items:center;
  }
  .hint{font-size:12px;color:var(--mute);letter-spacing:.14em}
  .fallback{display:none;color:var(--scope);font-size:14px;text-decoration:none;border-bottom:1px solid var(--scope)}
  footer[data-widget="off"] .hint{display:none}
  footer[data-widget="off"] .fallback{display:inline}

  /* ---------- paisagem ---------- */
  @media (orientation:landscape){
    body{
      padding-left:max(54px, env(safe-area-inset-left));
      padding-right:max(54px, env(safe-area-inset-right));
    }
    header{padding:7px 18px}
    #route{padding:5px 18px 2px}
    #track{height:26px}
    .ap{font-size:11px}
    main{padding:10px 120px 8px 18px}
    .kicker{margin-bottom:5px}
    #tip{margin-top:7px;font-size:13px}
    footer{min-height:0;padding:5px 18px calc(5px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg id="scope" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g id="rings"></g>
  <g id="spokes"></g>
  <g id="ticks"></g>
  <g id="sweep">
    <defs>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1FE0A8" stop-opacity="0"/>
        <stop offset="100%" stop-color="#1FE0A8" stop-opacity=".22"/>
      </linearGradient>
    </defs>
    <path d="M200,200 L200,20 A180,180 0 0,1 330,80 Z" fill="url(#sw)"/>
  </g>
</svg>

<header>
  <span class="stn"><span class="live"></span><span id="stn">STANDBY</span></span>
  <span class="spacer"></span>
  <span class="meta" id="meta">VH-VHD</span>
</header>

<div id="route">
  <span class="ap off" id="orig">DEP</span>
  <span id="track"><i id="fill"></i></span>
  <span class="ap off" id="dest">ARR</span>
</div>

<main>
  <div class="kicker">You say</div>
  <div id="say"><span class="idle">Tap to talk and start the session. Your next transmission appears here.</span></div>
  <div id="tip"></div>
</main>

<footer id="dock" data-widget="off">
  <span class="hint">TAP TO TALK</span>
  <a class="fallback" href="https://elevenlabs.io/app/talk-to?agent_id=agent_0301m24b5z0det78725wqkdphtx5" target="_blank" rel="noopener">Open the controller</a>
  <elevenlabs-convai agent-id="agent_0301m24b5z0det78725wqkdphtx5"></elevenlabs-convai>
</footer>

<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<script>
(function(){
  var sayEl = document.getElementById('say');
  var tipEl = document.getElementById('tip');
  var stnEl = document.getElementById('stn');
  var metaEl = document.getElementById('meta');
  var dock  = document.getElementById('dock');

  /* ----- radar scope ----- */
  var rings=document.getElementById('rings'), spokes=document.getElementById('spokes'), ticks=document.getElementById('ticks');
  var NS='http://www.w3.org/2000/svg';
  [45,90,135,180].forEach(function(r,i){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',200);c.setAttribute('cy',200);c.setAttribute('r',r);
    c.setAttribute('class', i===3 ? 'ring major' : 'ring');
    rings.appendChild(c);
  });
  for(var a=0;a<360;a+=30){
    var rad=(a-90)*Math.PI/180;
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',200);l.setAttribute('y1',200);
    l.setAttribute('x2',200+180*Math.cos(rad));l.setAttribute('y2',200+180*Math.sin(rad));
    l.setAttribute('class','spoke');
    spokes.appendChild(l);
  }
  [[45,'5'],[90,'10'],[135,'15'],[180,'20']].forEach(function(p){
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',204);t.setAttribute('y',200-p[0]+11);
    t.setAttribute('class','tick');t.textContent=p[1];
    ticks.appendChild(t);
  });

  /* ----- route strip ----- */
  var PHASES=['PARKED','TAXI','DEPARTURE','ENROUTE','ARRIVAL','LANDED'];
  var track=document.getElementById('track');
  var fillEl=document.getElementById('fill');
  var origEl=document.getElementById('orig');
  var destEl=document.getElementById('dest');
  var nodes=PHASES.map(function(name,i){
    var d=document.createElement('span');
    d.className='node';
    d.style.left=(i/(PHASES.length-1)*100)+'%';
    var b=document.createElement('b');
    b.textContent=name;
    d.appendChild(b);
    track.appendChild(d);
    return d;
  });
  var leg={origem:'',destino:'',fase:''};
  function setRoute(origem,destino,fase){
    origEl.textContent=origem||'DEP';
    destEl.textContent=destino||'ARR';
    origEl.className='ap'+(origem?'':' off');
    destEl.className='ap'+(destino?'':' off');
    var k=PHASES.indexOf(String(fase||'').toUpperCase());
    nodes.forEach(function(d,i){
      d.className='node'+(k<0?'':(i<k?' done':(i===k?' now':'')));
    });
    fillEl.style.width=(k<0?0:(k/(PHASES.length-1)*100))+'%';
  }

  /* ----- text auto-fit ----- */
  function fit(){
    var span=sayEl.firstElementChild;
    if(!span) return;
    var lo=15, hi=92, best=15;
    var maxH=sayEl.clientHeight, maxW=sayEl.clientWidth;
    if(maxH<10||maxW<10) return;
    while(lo<=hi){
      var mid=(lo+hi)>>1;
      span.style.fontSize=mid+'px';
      if(span.scrollHeight<=maxH && span.scrollWidth<=maxW+1){best=mid;lo=mid+1;}
      else{hi=mid-1;}
    }
    span.style.fontSize=best+'px';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,250)});

  /* ----- history ----- */
  var hist=[], idx=-1;
  function render(i){
    var it=hist[i]; if(!it) return;
    sayEl.innerHTML='';
    var s=document.createElement('span');
    s.textContent=it.texto;
    sayEl.appendChild(s);
    tipEl.textContent=it.dica||'';
    stnEl.textContent=it.estacao||'ATC';
    metaEl.textContent='VH-VHD  ·  '+(i+1)+'/'+hist.length;
    setRoute(it.origem,it.destino,it.fase);
    fit();
  }
  function push(item){
    hist.push(item); idx=hist.length-1; render(idx);
  }

  /* ----- client tool ----- */
  function mostrarFrase(args){
    args=args||{};
    if(!args.texto) return 'no text';
    if(args.origem)  leg.origem  = String(args.origem);
    if(args.destino) leg.destino = String(args.destino);
    if(args.fase)    leg.fase    = String(args.fase);
    push({texto:String(args.texto), dica:args.dica?String(args.dica):'', estacao:args.estacao?String(args.estacao):'ATC',
          origem:leg.origem, destino:leg.destino, fase:leg.fase});
    return 'shown';
  }
  window.mostrar_frase = mostrarFrase;

  function wire(el){
    if(!el || el.__wired) return;
    el.__wired = true;
    el.addEventListener('elevenlabs-convai:call', function(e){
      try{
        e.detail.config.clientTools = Object.assign({}, e.detail.config.clientTools, {
          mostrar_frase: mostrarFrase
        });
      }catch(err){}
    });
  }

  var widget = document.querySelector('elevenlabs-convai');
  wire(widget);

  /* the custom element may mount late; observe and rewire */
  var mo = new MutationObserver(function(){
    wire(document.querySelector('elevenlabs-convai'));
  });
  mo.observe(document.body,{childList:true,subtree:true});

  /* widget state */
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    var w=document.querySelector('elevenlabs-convai');
    if(w && (w.shadowRoot || w.children.length)){
      dock.setAttribute('data-widget','on');
      wire(w);
      clearInterval(iv);
    } else if(tries>20){
      dock.setAttribute('data-widget','off');
      clearInterval(iv);
    }
  },400);

  /* step through history */
  function step(d){
    if(!hist.length) return;
    var n=idx+d;
    if(n<0||n>=hist.length) return;
    idx=n; render(idx);
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') step(-1);
    if(e.key==='ArrowRight') step(1);
  });
  var startX=null;
  document.addEventListener('touchstart',function(e){startX=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){
    if(startX===null) return;
    var dx=e.changedTouches[0].clientX-startX;
    if(Math.abs(dx)>70) step(dx>0?-1:1);
    startX=null;
  },{passive:true});

  fit();
})();
</script>
</body>
</html>
